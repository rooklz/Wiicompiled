schema_version: 1
workspace_root: ../..

# Mario Kart Wii NTSC-U (RMCE01) with Wiimm's Wiimmfi patch (Wiimmfi Patcher v7.5,
# `wstrt patch --clean-dol --wiimmfi --all-ranks`) applied to the clean executables. The patch
# adds one code section at 0x802C0000 holding the Wiimmfi login/anticheat code and makes it the
# DOL entry point (it chains to the original __start), NOPs one call at 0x800ED7C8, and rewrites
# the WFC host names and the SAKE rank filters. Nothing else moves, so the clean map and the
# RMCE01 region table apply unchanged; the added section is discovered from its entry point.
project:
  id: mkwii-rmce01-wiimmfi
  display_name: Mario Kart Wii NTSC-U (Wiimmfi)
  game_id: RMCE01
  region: E
  base_manifest_format: mkwii-recomp-base-manifest
  base_manifest_stem: mkwii_base

memory:
  base: 0x80000000
  size: 0x01A00000
  sda_base: 0x80388880
  sda2_base: 0x8038AC20

inputs:
  dol:
    path: Assets/wiimmfi/main.dol
    sha256: 8dc5e777f85d23acf1dcc838d1d2b8913da7ff9f7f2efee4aacd279dc692a44a

  rel:
    path: Assets/wiimmfi/StaticR.rel
    load_address: 0x8050BF60
    sha256: 83555e6e16948351dae36bf9332f5f53814bd07775f6a5fcef47972be8d38dd8

translation:
  entry_points:
    - 0x802C0000
    - 0x800060A4
  function_map:
    path: projects/mkwii-ntsc/MAP.txt
  allow_unsupported_instructions: false

runtime:
  native_registration_root: runtime/src
  native_abi_directories:
    - runtime/src/hle/gx
  guest_address_table: runtime/include/region/rmce01.h

output:
  root: generated-wiimmfi
  functions: functions
  runtime_config: RuntimeConfig.h
  data_initializer: data_sections_init.cpp
  base_manifest: ../build/wiimmfi/mkwii_base_manifest.json

profiles:
  retro-rewind:
    enabled: false
