schema_version: 1
workspace_root: ../..

# Mario Kart Wii NTSC-U (RMCE01). Same translation surface as projects/mkwii/recomp.yml, with
# the layout facts that differ per region: the small-data bases the DOL's __init_registers
# installs, the StaticR.rel load address, and the clean-input digests. The function map is the
# PAL map ported with the community region table and validated against these binaries; see
# tools/region/port_map.py and MAP_REPORT.md.
project:
  id: mkwii-rmce01
  display_name: Mario Kart Wii NTSC-U
  game_id: RMCE01
  region: E
  base_manifest_format: mkwii-recomp-base-manifest
  base_manifest_stem: mkwii_base

memory:
  base: 0x80000000
  size: 0x01A00000
  sda_base: 0x80388880
  sda2_base: 0x8038AC20

inputs:
  dol:
    path: Assets/main.dol
    sha256: d2beec1b1645fcd134efe9e7e63774b546667764ed8d431029daccd725995694

  rel:
    path: Assets/StaticR.rel
    load_address: 0x8050BF60
    sha256: 1168107f8fdef27a356df76036db55afe4fbf7752606dbac991726701133a617

translation:
  entry_points:
    - 0x800060A4
  function_map:
    path: projects/mkwii-ntsc/MAP.txt
  allow_unsupported_instructions: false

runtime:
  native_registration_root: runtime/src
  native_abi_directories:
    - runtime/src/hle/gx
  # The runtime names guest addresses by their PAL identity; this table (also the header the
  # compiler resolves them through) gives the translator the RMCE01 addresses it registers.
  guest_address_table: runtime/include/region/rmce01.h

output:
  root: generated
  functions: functions
  runtime_config: RuntimeConfig.h
  data_initializer: data_sections_init.cpp
  base_manifest: ../build/base/mkwii_base_manifest.json

profiles:
  retro-rewind:
    enabled: true
    requires_game_id: RMCE01
    requires_dol_sha256: d2beec1b1645fcd134efe9e7e63774b546667764ed8d431029daccd725995694
    code_pul: PulsarPacks/completed/RetroRewind/RetroRewind6/Binaries/Code.pul
    mod_root: PulsarPacks/completed/RetroRewind/RetroRewind6
    # Code.pul is a combined Kamek file with one chunk per region (P, E, J; K empty); E is the
    # NTSC-U chunk. The module image is placed at the same MEM1-tail reservation as the PAL
    # profile. The link base is where Pulsar's loader allocates the module on a console -
    # arena lo + 0x160 (PAL: 0x80399180 + 0x160 = 0x803992E0); NTSC-U's arena lo is
    # 0x80394E00 (initial stack top from __init_registers), so the same relationship gives
    # 0x80394F60.
    region: E
    module_guest_base: 0x81800000
    module_link_base: 0x80394F60
    output: build/mods/retro_rewind_full_cpp
    enable_retro_wfc: true
    # The shared Retro-WFC payload keyed by game id; the server serves an RMCE variant.
    retro_wfc_payload: http://nas.play.rwfc.net/payload?g=RMCED00
    # PAL hook 0x800ED6E8 ported through the region table lands on the NTSC-U function entry
    # at 0x800ED648 (stwu/mflr prologue, previous word blr).
    retro_wfc_legacy_bootstrap_hook: 0x800ED648
    riivolution:
      xml: xml/RetroRewind6.xml
      options:
        - section: Retro Rewind
          option: Pack
          choice: 1
